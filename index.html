<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img src="./logo.png" alt="" >
        </div>
        <nav class="main-nav">
            <button class="mobile-menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
            <ul class="mobile-menu-list">
                <li><a href="#hero">Home</a></li>
                <li><a href="#select-container">Movies</a></li>
            </ul>
        </nav>
    </header>
    <section id="hero">
        <h1>
            My movie list
        </h1>
        <p>
            Find your next movie!
        </p>
    </section>
    <main>
        <div id="select-container">
            <select name="" id="genre-filter">

            </select>
        </div>

        <div id="movie-container">

        </div>

        <div id="add-movie-container">
            <form action="" id="add-movie-form" >
                <h2>Add a movie</h2>
                <label for="name" >Name</label>
                <input type="text" name="name" placeholder="Name" required>

                <label for="year">Year</label>
                <input type="number" name="year" placeholder="Year" required>

                <label for="rating">Rating</label>
                <input type="number" name="rating" placeholder="Rating" required>

                <label for="genre">Genre</label>
                <input type="text" name="genre" placeholder="Genre" required>

                <button type="submit" class="btn">Add movie</button>
            </form>
        </div>

    </main>
    <footer>
        &copy; 2026 My movie list
    </footer>
</body>
</html>
